name: RESQNET CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for GeoSpatial & Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite with Coverage
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///:memory:
          USE_AWS_SERVICES: "false"
        run: |
          python -m pytest backend/tests -v --durations=10

  frontend-checks:
    name: Frontend Linting, Types & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npm run lint

      - name: Run Production Bundle Build
        working-directory: frontend
        run: npm run build

  docker-build-verification:
    name: Backend Docker Image Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: resqnet-backend:ci-test

  terraform-checks:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate Dev Environment Configuration
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate
