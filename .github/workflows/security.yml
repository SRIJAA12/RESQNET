name: RESQNET Security Audits

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday scan

jobs:
  npm-audit:
    name: Frontend Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local container image
        run: docker build -t resqnet-backend:audit ./backend
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'resqnet-backend:audit'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
